name: Push and Deploy

on:
  push:
    branches:
      - develop  # This is the "Trigger"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auth Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      # 1. BUILD AND PUSH THE IMAGE
      - name: Build and Push
        run: |
          IMAGE=asia-south1-docker.pkg.dev/secure-487209/demo2/app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # 2. COPY COMPOSE & NGINX FILES TO VM
      # 2. THE FIX: Create the folder first!
      - name: Create folder and Copy Configs
        run: |
          # 1. Create the folder on the VM
          gcloud compute ssh instance-20260214-054001 --zone=asia-south2-a --project=secure-487209 --quiet --command="mkdir -p ~/app"
          
          # 2. Now copy the files into that folder
          gcloud compute scp docker-compose.yml nginx.conf instance-20260214-054001:~/app/ --zone=asia-south2-a --project=secure-487209 --quiet

      # 3. RESTART
      # 3. TELL VM TO REFRESH (COS Way)
      - name: SSH and Restart
        run: |
          gcloud compute ssh instance-20260214-054001 \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --quiet \
            --command="
              # 1. Pull the new image
              sudo docker pull asia-south1-docker.pkg.dev/secure-487209/demo2/app:latest

              # 2. Stop and remove the old container if it exists
              sudo docker stop my-app || true
              sudo docker rm my-app || true

              # 3. Run the new container
              sudo docker run -d \
                --name my-app \
                --restart always \
                -p 80:5000 \
                asia-south1-docker.pkg.dev/secure-487209/demo2/app:latest
            "
