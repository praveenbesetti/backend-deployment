name: Build and Deploy to Private VM

on:
  push:
    branches: [ "develop" ] # Ensure this matches your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Mandatory for OIDC/WIF

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'vm-runner@secure-487209.iam.gserviceaccount.com'
        # Explicitly setting the audience helps Google verify the token source
        audience: 'https://iam.googleapis.com/projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

    - name: 'Docker Auth'
      run: |-
        # Using 'oauth2accesstoken' (one word, no 's') is the exact username GAR expects
        echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev
    # 3. Build and Push
    - name: 'Build and Push Image'
      run: |-
        docker build -t asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }} .
        docker push asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}

    - name: 'Update VM Deployment'
      run: |-
        # 1. We create the script as a single variable. 
        # Note: We use \ for $ that the VM should handle, and no \ for GitHub variables.
        STARTUP_SCRIPT="#! /bin/bash
        mkdir -p /tmp/docker_config
        
        # VM-level variable: needs backslash so GitHub ignores it
        TOKEN=\$(curl -s -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token | grep -oP '\"access_token\":\"\K[^\"]+')
        
        # GitHub-level variable: no backslash so GitHub replaces it now
        IMAGE_NAME=\"asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}\"

        echo \"\$TOKEN\" | docker --config /tmp/docker_config login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev
        
        docker --config /tmp/docker_config pull \$IMAGE_NAME
        
        docker stop my-app nginx-proxy || true
        docker rm my-app nginx-proxy || true
        
        docker run -d --name my-app --restart always -p 5000:5000 \$IMAGE_NAME
        
        cat <<EOF > /tmp/nginx.conf
        events {}
        http {
            server {
                listen 80;
                location / {
                    proxy_pass http://localhost:5000;
                    proxy_set_header Host \\\$host;
                }
            }
        }
        EOF
        
        docker run -d --name nginx-proxy --restart always -p 80:80 -v /tmp/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine"

        # 2. Push the script to the VM metadata
        gcloud compute instances add-metadata instance-20260213-035410 \
          --zone=asia-south1-a \
          --metadata=startup-script="\$STARTUP_SCRIPT"

        # 3. Force the VM to run the new script
        gcloud compute instances reset instance-20260213-035410 --zone=asia-south1-a
