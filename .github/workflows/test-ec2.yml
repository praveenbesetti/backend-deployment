name: Push and Deploy

on:
  push:
    branches:
      - develop  # This is the "Trigger"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auth Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      # 1. BUILD AND PUSH THE IMAGE
      - name: Build and Push
        run: |
          IMAGE=asia-south1-docker.pkg.dev/secure-487209/demo2/app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # 2. COPY COMPOSE & NGINX FILES TO VM
      # 2. THE FIX: Create the folder first!
      - name: Create folder and Copy Configs
        run: |
          # 1. Create the folder on the VM
          gcloud compute ssh instance-20260214-105733 --zone=asia-south2-a --project=secure-487209 --quiet --command="mkdir -p ~/app"
          
          # 2. Now copy the files into that folder
          gcloud compute scp docker-compose.yml nginx.conf instance-20260214-105733:~/app/ --zone=asia-south2-a --project=secure-487209 --quiet

      # 3. RESTART
      # 3. TELL VM TO REFRESH (COS Way)
      - name: Deploy to Ubuntu
        run: |
          gcloud compute ssh instance-20260214-105733 \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --quiet \
            --command="
              # 1. Login Docker ON THE VM (Standard way works on Ubuntu)
              gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

              # 2. Go to app folder
              cd ~/app

              # 3. Use Compose to pull new image and restart services
              # This will automatically use your docker-compose.yml
              sudo docker compose pull
              sudo docker compose up -d
            "
