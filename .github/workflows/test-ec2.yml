name: Push and Deploy

on:
  push:
    branches:
      - develop  # This is the "Trigger"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auth Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      # 1. BUILD AND PUSH THE IMAGE
      - name: Build and Push
        run: |
          IMAGE=asia-south1-docker.pkg.dev/secure-487209/demo2/app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # 2. COPY COMPOSE & NGINX FILES TO VM
      - name: Copy Configs to VM
        run: |
          gcloud compute scp docker-compose.yml nginx.conf instance-20260214-054001:~/app/ --zone asia-south2-a

      # 3. TELL VM TO REFRESH
      - name: SSH and Restart
        run: |
          gcloud compute sshinstance-20260214-054001 --zone asia-south2-a --command "
            cd ~/app
            docker-compose pull
            docker-compose up -d
            docker image prune -f
          "
