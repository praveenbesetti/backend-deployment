name: Build and Deploy to Private VM

on:
  push:
    branches: [ "develop" ] # Ensure this matches your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Mandatory for OIDC/WIF

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'vm-runner@secure-487209.iam.gserviceaccount.com'
        # Explicitly setting the audience helps Google verify the token source
        audience: 'https://iam.googleapis.com/projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

    - name: 'Docker Auth'
      run: |-
        # Using 'oauth2accesstoken' (one word, no 's') is the exact username GAR expects
        echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev
    # 3. Build and Push
    - name: 'Build and Push Image'
      run: |-
        docker build -t asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }} .
        docker push asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}

    - name: 'Update VM Deployment'
      run: |-
        # We define the script as a variable to keep the gcloud command clean
        STARTUP_SCRIPT="#! /bin/bash
        # 1. Direct login using the VM's own identity (bypasses read-only config issues)
        ACCESS_TOKEN=\$(curl -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token | grep -oP '\"access_token\":\"\K[^\"]+')
        echo \"\$ACCESS_TOKEN\" | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev

        # 2. Stop and Clean
        docker stop my-app nginx-proxy || true
        docker rm my-app nginx-proxy || true
        
        # 3. Pull and Run App
        docker pull asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}
        docker run -d --name my-app --restart always -p 5000:5000 \
          asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}
        
        # 4. Setup Nginx
        cat <<EOF > /tmp/nginx.conf
        events {}
        http {
            server {
                listen 80;
                location / {
                    proxy_pass http://localhost:5000;
                    proxy_set_header Host \$host;
                }
            }
        }
        EOF
        
        docker run -d --name nginx-proxy --restart always -p 80:80 \
          -v /tmp/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine"

        # Apply the metadata
        gcloud compute instances add-metadata instance-20260213-035410 \
          --zone=asia-south1-a \
          --metadata=startup-script="\$STARTUP_SCRIPT"

        # Trigger the script immediately
        gcloud compute instances reset instance-20260213-035410 --zone=asia-south1-a
