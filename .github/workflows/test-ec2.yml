name: Deploy to GCP VM

on:
  push:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
   
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }} # Fixed the space here
          script: |
            # 1. Setup path variables
            APP_DIR="/home/${{ secrets.GCP_USERNAME }}/my-app"
            
            # 2. Backup .env if it exists
            if [ -f "$APP_DIR/.env" ]; then
                cp "$APP_DIR/.env" ~/env_backup
            fi

            # 3. Delete old folders and Fresh Clone
            rm -rf "$APP_DIR"
            git clone -b develop https://github.com/${{ github.repository }}.git "$APP_DIR"
            
            # 4. Restore .env
            if [ -f ~/env_backup ]; then
                mv ~/env_backup "$APP_DIR/.env"
            fi

            # 5. Install and Start
            cd "$APP_DIR"
            npm install --production
            
            # 6. PM2 Management
            # We use 'delete' then 'start' to ensure a clean slate every time
            pm2 delete my-server || true
            pm2 start server.js --name "my-server"
            pm2 save
