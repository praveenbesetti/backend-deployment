name: Build and Deploy to Private VM

on:
  push:
    branches: [ "develop" ] # Triggers whenever you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud using WIF
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'vm-runner@secure-487209.iam.gserviceaccount.com'

    # 2. Setup Google Cloud SDK
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    # 3. Configure Docker for Artifact Registry
    - name: 'Docker Auth'
      run: |-
        gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

    # 4. Build and Push the Docker Image
    - name: 'Build and Push Image'
      run: |-
        docker build -t asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }} .
        docker push asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}

    # 5. Update VM Metadata and Restart
    # This replaces the startup-script on the VM with the one using the NEW image tag
    - name: 'Update VM Deployment'
      run: |-
        gcloud compute instances add-metadata my-app-server \
          --zone=asia-south1-a \
          --metadata=startup-script="#! /bin/bash
          docker-credential-gcr configure-docker --registries=asia-south1-docker.pkg.dev
          docker stop my-app nginx-proxy || true
          docker rm my-app nginx-proxy || true
          
          # Pull the specific version we just built
          docker pull asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}
          
          # Run the App
          docker run -d --name my-app --restart always -p 5000:5000 \
            asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}
          
          # Setup Nginx
          cat <<EOF > /tmp/nginx.conf
          events {}
          http {
              server {
                  listen 80;
                  location / {
                      proxy_pass http://localhost:5000;
                      proxy_set_header Host \$host;
                  }
              }
          }
          EOF
          
          # Run Nginx
          docker run -d --name nginx-proxy --restart always -p 80:80 \
            -v /tmp/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine"

        # Restart the VM to trigger the new startup script
        gcloud compute instances reset instance-20260213-035410 --zone=asia-south1-a
