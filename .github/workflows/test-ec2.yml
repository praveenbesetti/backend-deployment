name: Build and Deploy to Private VM

on:
  push:
    branches: [ "develop" ] # Ensure this matches your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Mandatory for OIDC/WIF

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'vm-runner@secure-487209.iam.gserviceaccount.com'
        # Explicitly setting the audience helps Google verify the token source
        audience: 'https://iam.googleapis.com/projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

    - name: 'Docker Auth'
      run: |-
        # Using 'oauth2accesstoken' (one word, no 's') is the exact username GAR expects
        echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev
    # 3. Build and Push
    - name: 'Build and Push Image'
      run: |-
        docker build -t asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }} .
        docker push asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}

    - name: 'Update VM Deployment'
      run: |-
        # 1. Create the script file
        cat <<EOF > startup.sh
        #! /bin/bash
        # Log everything to a file so we can see it
        exec > /tmp/startup-log.txt 2>&1
        
        echo "Starting deployment script..."
        
        # Cleanup
        rm -rf /tmp/nginx.conf
        docker stop my-app nginx-proxy || true
        docker rm my-app nginx-proxy || true

        # Auth
        TOKEN=\$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token | cut -d'\"' -f4)
        echo "\$TOKEN" | docker --config /home/praveenbesetti09/.docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev

        # Pull and Run
        IMAGE="asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}"
        docker --config /home/praveenbesetti09/.docker pull \$IMAGE
        
        docker run -d --name my-app --restart always -p 5000:5000 \$IMAGE

        # Nginx config
        cat <<EOT > /tmp/nginx.conf
        events {}
        http {
            server {
                listen 80;
                location / {
                    proxy_pass http://localhost:5000;
                    proxy_set_header Host \\\$host;
                }
            }
        }
        EOT

        docker run -d --name nginx-proxy --restart always -p 80:80 -v /tmp/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine
        echo "Deployment finished."
        EOF

        # 2. FORCE update the metadata (Remove then Add)
        gcloud compute instances remove-metadata instance-20260213-035410 --zone=asia-south1-a --keys=startup-script || true
        
        gcloud compute instances add-metadata instance-20260213-035410 \
          --zone=asia-south1-a \
          --metadata-from-file=startup-script=startup.sh

        # 3. Reset
        gcloud compute instances reset instance-20260213-035410 --zone=asia-south1-a
