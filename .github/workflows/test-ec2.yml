name: Push and Deploy

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write   

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. DOWNLOAD THE CODE (Don't skip this!)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. AUTH VIA WIF
      - name: Auth Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token' 
          project_id: 'secure-487209'
          workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@secure-487209.iam.gserviceaccount.com'

      # 3. DEBUG: Check if Dockerfile exists
      - name: List files
        run: ls -R

      # 4. LOGIN TO DOCKER
      - name: Configure Docker
        run: |
          echo ${{ steps.auth.outputs.access_token }} | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 5. BUILD AND PUSH
      - name: Build and Push
        run: |
          IMAGE=asia-south1-docker.pkg.dev/secure-487209/demo2/app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # 6. SYNC CONFIGS (IAP Tunnel)
      - name: Create folder and Copy Configs
        run: |
          gcloud compute scp docker-compose.yml nginx.conf instance-20260214-114156:~/ \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --tunnel-through-iap \
            --quiet

          gcloud compute ssh instance-20260214-114156 \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --tunnel-through-iap \
            --quiet \
            --command="mkdir -p ~/app && mv ~/docker-compose.yml ~/nginx.conf ~/app/"

      # 7. DEPLOY
      - name: Deploy to Ubuntu
        run: |
          gcloud compute ssh instance-20260214-114156 \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --tunnel-through-iap \
            --quiet \
            --command="
              gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
              sudo gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
              cd ~/app
              sudo docker compose pull
              sudo docker compose up -d
            "
