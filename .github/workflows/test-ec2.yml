name: Build and Deploy to Private VM

on:
  push:
    branches: [ "develop" ] # Ensure this matches your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Mandatory for OIDC/WIF

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'vm-runner@secure-487209.iam.gserviceaccount.com'
        # Explicitly setting the audience helps Google verify the token source
        audience: 'https://iam.googleapis.com/projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

    - name: 'Docker Auth'
      run: |-
        # Using 'oauth2accesstoken' (one word, no 's') is the exact username GAR expects
        echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev
    # 3. Build and Push
    - name: 'Build and Push Image'
      run: |-
        docker build -t asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }} .
        docker push asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}

    - name: 'Update VM Deployment'
      run: |-
        # 1. Create a Cloud-Config file
        # This tells COS exactly what to do without using a broken shell script
        cat <<EOF > cloud-config.yaml
        #cloud-config
        write_files:
          - path: /etc/systemd/system/my-app.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Run my app container
              Wants=gcr-online.target
              After=gcr-online.target

              [Service]
              Environment="HOME=/home/chronos"
              ExecStartPre=/usr/bin/docker-credential-gcr configure-docker --registries=asia-south1-docker.pkg.dev
              ExecStart=/usr/bin/docker run --name=my-app -p 5000:5000 asia-south1-docker.pkg.dev/secure-487209/demo2/app:${{ github.sha }}
              ExecStop=/usr/bin/docker stop my-app
              ExecStopPost=/usr/bin/docker rm my-app

          - path: /etc/systemd/system/nginx-proxy.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Run nginx proxy
              After=my-app.service

              [Service]
              ExecStart=/usr/bin/docker run --name=nginx-proxy -p 80:80 nginx:alpine
              ExecStop=/usr/bin/docker stop nginx-proxy
              ExecStopPost=/usr/bin/docker rm nginx-proxy

        runcmd:
          - systemctl daemon-reload
          - systemctl start my-app.service
          - systemctl start nginx-proxy.service
        EOF

        # 2. Apply this to the VM as 'user-data' (The COS way)
        gcloud compute instances add-metadata instance-20260213-035410 \
          --zone=asia-south1-a \
          --metadata-from-file=user-data=cloud-config.yaml

        # 3. Reset the VM
        gcloud compute instances reset instance-20260213-035410 --zone=asia-south1-a
