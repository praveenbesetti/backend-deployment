name: Push and Deploy

on:
  push:
    branches:
      - develop
permissions:
  contents: read
  id-token: write   

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # CRITICAL: You need this to get your Dockerfile and code!
      - name: Auth Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # This line is the magic fix for Docker push errors
          token_format: 'access_token' 
          project_id: 'secure-487209'
          workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@secure-487209.iam.gserviceaccount.com'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          # Use the token directly from the auth step
          echo ${{ steps.auth.outputs.access_token }} | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GitHub Runner
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # 2. BUILD AND PUSH
      - name: Build and Push
        run: |
          IMAGE=asia-south1-docker.pkg.dev/secure-487209/demo2/app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # 3. SYNC CONFIGS (Added IAP Tunnel)
     # 3. SYNC CONFIGS (Optimized)
      - name: Create folder and Copy Configs
        run: |
          # We can create the folder and SCP in one logic block
          gcloud compute scp docker-compose.yml nginx.conf instance-20260214-105733:~/ \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --tunnel-through-iap \
            --quiet

          # Move them to the app folder on the VM
          gcloud compute ssh instance-20260214-105733 \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --tunnel-through-iap \
            --quiet \
            --command="mkdir -p ~/app && mv ~/docker-compose.yml ~/nginx.conf ~/app/"
      # 4. DEPLOY (Added IAP Tunnel and sudo fix)
      - name: Deploy to Ubuntu
        run: |
          gcloud compute ssh instance-20260214-105733 \
            --zone=asia-south2-a \
            --project=secure-487209 \
            --tunnel-through-iap \
            --quiet \
            --command="
              # Configure auth for both users to avoid permission denied on pull
              gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
              sudo gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

              cd ~/app
              sudo docker compose pull
              sudo docker compose up -d
            "
