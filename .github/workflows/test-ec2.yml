          script: |
            # 1. Setup path variables
            APP_DIR="/home/${{ secrets.GCP_USERNAME }}/my-app"
            
            # 2. Backup .env (Crucial so you don't lose DB passwords)
            if [ -f "$APP_DIR/.env" ]; then
                cp "$APP_DIR/.env" ~/env_backup
            fi

            # 3. Delete and Fresh Clone
            rm -rf "$APP_DIR"
            git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            
            # 4. Restore .env
            if [ -f ~/env_backup ]; then
                mv ~/env_backup "$APP_DIR/.env"
            fi

            # 5. Build and Start
            cd "$APP_DIR"
            npm install --production
            
            # Restart if exists, otherwise start new
            # Change 'index.js' to your main file name (e.g., server.js)
            pm2 restart my-server || pm2 start index.js --name "my-server"
            pm2 save
