name: Secure Deploy to GCP
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Using the project number for WIF and project ID for the account
          workload_identity_provider: 'projects/300154363292/locations/global/workloadIdentityPools/github-actions/providers/github-pool'
          service_account: 'github-deployer@secure-487209.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          # Replace 'your-project' and 'app-repo' with your actual names
          docker build -t us-central1-docker.pkg.dev/secure-487209/app-repo/app:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/secure-487209/app-repo/app:${{ github.sha }}

      - name: Update VM Group
        run: |
          # 1. Create a unique template name
          TEMPLATE_NAME="app-template-${{ github.sha }}"
          
          # 2. Create the template (Ensure vm-runner email is correct)
          gcloud compute instance-templates create-with-container "instance-template-20260212-093835" \
            --container-image=us-central1-docker.pkg.dev/secure-487209/app-repo/app:${{ github.sha }} \
            --service-account=vm-runner@secure-487209.iam.gserviceaccount.com \
            --region=us-central1

          # 3. Update the Managed Instance Group
          # Replace 'your-vm-group' with your actual MIG name
          gcloud compute instance-groups managed rolling-action start-update your-vm-group \
            --version=template="instance-template-20260212-093835" \
            --region=asia-south1
